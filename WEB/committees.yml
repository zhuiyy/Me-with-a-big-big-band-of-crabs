- name: 分类委员会
  reason: |
    该投稿在被分类前似乎可以成立；但一旦分类成立，投稿成立所需的无辜状态就消失了。因此委员会决定保存分类，不保存投稿。

- name: README 伦理委员会
  reason: |
    README 有权介绍目录，但投稿没有权力预设自己将被 README 介绍。该预设过于成熟，建议退回未命名阶段。

- name: 形式逻辑委员会
  reason: |
    设 P 为“本投稿应该通过”。委员会无法证明 P，也无法证明非 P；为避免系统误以为这是深刻结论，暂按未通过处理。

- name: 文件系统委员会
  reason: |
    该投稿若离开路径仍然成立，说明它还不够依赖文件系统；若离开路径不成立，说明它过度依赖文件系统。两种情况均需人工审核。

- name: 投稿失败委员会
  reason: |
    本委员会只审查失败投稿。当前投稿尚未失败到足以被本委员会审查，因此本委员会拒绝承认自己已经审查了它。

- name: 三值逻辑临时小组
  reason: |
    审查值为未定。未定不是通过，也不是拒绝；但网页按钮需要一个结果，所以未定暂时显示为未通过。
