name: WEB投稿转PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.body, 'TUTORIAL_WEB_SUBMISSION')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DAILY_LIMIT: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Check daily limit
        id: limit
        run: |
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "created:$TODAY" --limit 100 --json body --jq '[.[] | select(.body | contains("TUTORIAL_WEB_SUBMISSION"))] | length')"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "$DAILY_LIMIT" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WEB今日只收 $DAILY_LIMIT 条。此投稿已抵达门口，但门口今日已经下班。"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Create submission file
        if: steps.limit.outputs.allowed == 'true'
        run: |
          BRANCH="tutorial-web/${{ steps.limit.outputs.today }}/issue-${ISSUE_NUMBER}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          node .github/workflows/write-tutorial-web-submission.js
          git add 投稿箱
          git commit -m "WEB投稿 #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"

      - name: Open draft PR
        if: steps.limit.outputs.allowed == 'true'
        run: |
          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$ISSUE_TITLE" \
            --body "来自WEB的自动投稿，原 Issue：#${ISSUE_NUMBER}。请人工审核它是真的笑话，还是只是在利用审核流程制造笑话。")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "已转成 draft PR：$PR_URL"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "completed"
